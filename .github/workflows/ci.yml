name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check committed files and secrets
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$GATE_BASE" && ! "$GATE_BASE" =~ ^0+$ ]]; then
            pnpm run check:staged --base "$GATE_BASE"
          else
            base=$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -t tree --stdin </dev/null)
            pnpm run check:staged --base "$base"
          fi

      - name: Check source, tests, build, and pinned Pi host
        shell: bash
        run: |
          mkdir -p .tmp/test-results
          set -o pipefail
          pnpm run check 2>&1 | tee .tmp/test-results/check.log

      - name: Verify ignored files are not tracked
        shell: bash
        run: |
          tracked_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Inspect package contents
        run: pnpm pack --dry-run

      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}
          path: .tmp/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  check:
    name: Check
    if: ${{ always() }}
    needs: [test, unix-host, python-and-skills, pi152-host]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          install: false
      - name: Require every CI job to pass
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          pnpm_config_verify_deps_before_run: "false"
        run: pnpm exec node scripts/check-ci.mjs

  unix-host:
    name: Unix host / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [pty]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: conda-incubator/setup-miniconda@v4
        if: matrix.suite == 'pty'
        with:
          miniforge-version: latest
          activate-environment: codex-py312
          python-version: '3.12'
      - name: Install terminal emulator
        if: matrix.suite == 'pty'
        run: conda run -n codex-py312 python -m pip install pyte==0.8.2
      - name: Run offline host acceptance
        shell: bash
        run: |
          mkdir -p .tmp/test-results
          set -o pipefail
          conda run -n codex-py312 python -m unittest discover -s .cursor/skills/verify-pi-openai-fast-mode/scripts -p 'test_*.py'
          pnpm run host:${{ matrix.suite }}:check 2>&1 | tee .tmp/test-results/host.log
      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unix-host-${{ matrix.suite }}
          path: .tmp/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  python-and-skills:
    name: Python grading and skill installation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: codex-py312
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: conda run -n codex-py312 python -m pip install pyte==0.8.2 -r scripts/codex-compact-quality-requirements.txt
      - name: Verify offline grading and installed skills
        shell: bash
        run: |
          mkdir -p .tmp/test-results
          set -o pipefail
          pnpm run codex-compact:quality:check 2>&1 | tee .tmp/test-results/python.log
          pnpm run skill-mentions:acceptance --evidence-prefix=ci-skill-install 2>&1 | tee .tmp/test-results/skills.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-and-skills
          path: .tmp/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  pi152-host:
    name: Pi 1.5.2 / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [stock, patched]
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: codex-py312
          python-version: '3.12'
      - name: Install dependencies and terminal emulator
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          conda run -n codex-py312 python -m pip install pyte==0.8.2
      - name: Verify independent host and user journeys
        shell: bash
        run: |
          mkdir -p .tmp/test-results
          set -o pipefail
          pnpm run pi152:check ${{ matrix.profile }} 2>&1 | tee .tmp/test-results/pi152.log
      - name: Upload host identity and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi152-${{ matrix.profile }}
          path: |
            .tmp/test-results/
            !.tmp/test-results/**/node_modules/**
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
