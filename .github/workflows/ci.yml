name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check source, tests, and build
        run: pnpm run check

      - name: Verify committed build artifacts
        run: git diff --exit-code -- extensions/codex-compact/dist extensions/mcp/dist extensions/permissions/dist

      - name: Inspect package contents
        run: pnpm pack --dry-run
