name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check committed files and secrets
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [[ -n "$GATE_BASE" && ! "$GATE_BASE" =~ ^0+$ ]]; then
            pnpm run check:staged --base "$GATE_BASE"
          else
            base=$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -t tree --stdin </dev/null)
            pnpm run check:staged --base "$base"
          fi

      - name: Check source, tests, build, and pinned Pi host
        shell: bash
        run: |
          mkdir -p .tmp/test-results
          set -o pipefail
          pnpm run check 2>&1 | tee .tmp/test-results/check.log

      - name: Verify ignored files are not tracked
        shell: bash
        run: |
          tracked_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Inspect package contents
        run: pnpm -r --filter "./extensions/*" pack --dry-run

      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-${{ matrix.os }}
          path: .tmp/test-results/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7

  check:
    name: Check
    if: ${{ always() }}
    needs: [test, unix-host]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          install: false
      - name: Require every CI job to pass
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
          pnpm_config_verify_deps_before_run: "false"
        run: pnpm exec node scripts/check-ci.mjs

  unix-host:
    name: Pi plugin terminal acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: codex-py312
          python-version: '3.12'
      - name: Install offline search tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep fd-find
      - name: Install terminal emulator
        run: conda run -n codex-py312 python -m pip install pyte==0.8.2
      - name: Run offline host acceptance
        shell: bash
        run: |
          mkdir -p .tmp/test-results
          set -o pipefail
          pnpm run build
          node --test .cursor/skills/verify-pi-codex-ui/scripts/runtime-support.test.mjs
          conda run -n codex-py312 python -m unittest discover -s .cursor/skills/verify-pi-codex-ui/scripts -p 'test_*.py'
          conda run -n codex-py312 python -m unittest discover -s test-support/fixtures/working
          pnpm run tool-status:check 2>&1 | tee .tmp/test-results/host.log
          pnpm run codemode:check
          conda run -n codex-py312 python extensions/codex-ui/__tests__/codemode-pty.py --custom-keys
          conda run -n codex-py312 python extensions/codex-ui/__tests__/codemode-pty.py --custom-keys --fullscreen
          for mode in regular fullscreen; do
            conda run --no-capture-output -n codex-py312 python .cursor/skills/verify-pi-codex-ui/scripts/cli.py "$mode"
            conda run --no-capture-output -n codex-py312 python .cursor/skills/verify-pi-codex-ui/scripts/cli.py "$mode" --pi-compat
            conda run --no-capture-output -n codex-py312 python .cursor/skills/verify-pi-claude-code-ui/scripts/cli.py "$mode"
            conda run -n codex-py312 python scripts/working-pty.py ".tmp/test-results/working-$mode" --mode "$mode"
          done
      - name: Upload host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unix-host
          path: |
            .tmp/test-results/
            .tmp/codemode-*.ansi
            .tmp/codemode-*.json
            .tmp/tool-status-*.ansi
            .tmp/tool-status-*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
