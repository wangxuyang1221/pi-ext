name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node 22 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/setup@v1
        with:
          runtime: node@22.19.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check source, tests, build, and pinned Pi host
        run: pnpm run check

      - name: Verify ignored files are not tracked
        shell: bash
        run: |
          tracked_ignored=$(git ls-files --cached --ignored --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            printf '%s\n' "$tracked_ignored"
            exit 1
          fi

      - name: Inspect package contents
        run: pnpm pack --dry-run
